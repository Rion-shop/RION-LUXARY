<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RION SHOP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Georgia, "Times New Roman", serif;
    background:#080808;
    color:white;
}

/* Loading Animation */
#loader{
    position:fixed;
    inset:0;
    background:#080808;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    animation:hideLoader 1s ease 2.5s forwards;
}

.loader-box{
    text-align:center;
    animation:zoom 1.5s ease infinite alternate;
}

.loader-box h1{
    font-size:38px;
    letter-spacing:5px;
    color:#d4af37;
}

.loader-box p{
    margin-top:10px;
    color:#aaa;
    letter-spacing:3px;
}

@keyframes zoom{
    from{transform:scale(.9);opacity:.5;}
    to{transform:scale(1.05);opacity:1;}
}

@keyframes hideLoader{
    to{
        opacity:0;
        visibility:hidden;
    }
}

/* Header */
header{
    text-align:center;
    padding:30px 15px 20px;
    background:linear-gradient(180deg,#151515,#090909);
    border-bottom:1px solid #333;
}

header h1{
    font-size:35px;
    letter-spacing:4px;
    color:#d4af37;
    animation:fadeDown 1.2s ease;
}

header p{
    margin-top:8px;
    color:#aaa;
    letter-spacing:2px;
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Search */
.search-area{
    padding:20px 15px;
    display:flex;
    justify-content:center;
}

#search{
    width:100%;
    max-width:550px;
    padding:15px 20px;
    border-radius:30px;
    border:1px solid #d4af37;
    background:#111;
    color:white;
    outline:none;
    font-size:16px;
}

#search::placeholder{
    color:#888;
}

/* Products */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
    padding:25px;
    max-width:1200px;
    margin:auto;
}

.product{
    background:#111;
    border:1px solid #292929;
    border-radius:15px;
    overflow:hidden;
    transition:.4s;
    animation:productShow 1s ease;
}

.product:hover{
    transform:translateY(-8px);
    border-color:#d4af37;
    box-shadow:0 10px 30px rgba(212,175,55,.2);
}

.product img{
    width:100%;
    height:280px;
    object-fit:contain;
    background:#fff;
    display:block;
}

.product-info{
    padding:18px;
    text-align:center;
}

.product-info h2{
    font-size:20px;
    margin-bottom:10px;
}

.price{
    color:#d4af37;
    font-size:19px;
    font-weight:bold;
}

@keyframes productShow{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.no-result{
    display:none;
    text-align:center;
    color:#aaa;
    padding:30px;
}
</style>
</head>

<body>

<!-- Opening Animation -->
<div id="loader">
    <div class="loader-box">
        <h1>RION SHOP</h1>
        <p>WELCOME</p>
    </div>
</div>

<!-- Header -->
<header>
    <h1>WELCOME TO OUR SHOP</h1>
    <p>Luxury • Style • Quality</p>
</header>

<!-- Search -->
<div class="search-area">
    <input
        type="text"
        id="search"
        placeholder="🔍 Search your product..."
        onkeyup="searchProducts()"
    >
</div>

<!-- Products -->
<div class="products" id="productList">

    <div class="product">
        <img src="product1.jpg" alt="Product 1">
        <div class="product-info">
            <h2>Luxury Product 1</h2>
            <div class="price">৳ 1,250</div>
        </div>
    </div>

    <div class="product">
        <img src="product2.jpg" alt="Product 2">
        <div class="product-info">
            <h2>Luxury Product 2</h2>
            <div class="price">৳ 1,500</div>
        </div>
    </div>

    <div class="product">
        <img src="product3.jpg" alt="Product 3">
        <div class="product-info">
            <h2>Luxury Product 3</h2>
            <div class="price">৳ 1,850</div>
        </div>
    </div>

    <div class="product">
        <img src="product4.jpg" alt="Product 4">
        <div class="product-info">
            <h2>Luxury Product 4</h2>
            <div class="price">৳ 2,000</div>
        </div>
    </div>

</div>

<div class="no-result" id="noResult">
    No product found.
</div>

<script>
function searchProducts(){

    let input = document
        .getElementById("search")
        .value
        .toLowerCase();

    let products = document
        .querySelectorAll(".product");

    let found = false;

    products.forEach(function(product){

        let name = product
            .querySelector("h2")
            .innerText
            .toLowerCase();

        if(name.includes(input)){
            product.style.display = "block";
            found = true;
        }else{
            product.style.display = "none";
        }

    });

    document.getElementById("noResult").style.display =
        found ? "none" : "block";
}
</script>

</body>
</html>
