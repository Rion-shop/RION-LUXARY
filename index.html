<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RION SHOP - Hoodie</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:#080808;
  color:#fff;
  font-family:Georgia,"Times New Roman",serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  width:min(100%,520px);
  background:#111;
  border:1px solid #d4af37;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.65);
  animation:show .8s ease;
}
.photo{
  background:#fff;
  width:100%;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
}
.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.info{text-align:center;padding:24px}
.logo{
  color:#d4af37;
  font-size:13px;
  letter-spacing:4px;
  margin-bottom:10px;
}
h1{
  font-size:28px;
  letter-spacing:1px;
  margin-bottom:10px;
}
.price{
  color:#d4af37;
  font-size:24px;
  font-weight:bold;
  margin-bottom:18px;
}
button{
  width:100%;
  border:0;
  border-radius:30px;
  padding:15px;
  background:#d4af37;
  color:#080808;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}
button:hover{background:#f0cf55}
@keyframes show{
  from{opacity:0;transform:translateY(25px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<div class="card">
  <div class="photo">
    <img src="hoodie.png" alt="RION SHOP Black Hoodie">
  </div>
  <div class="info">
    <div class="logo">RION SHOP</div>
    <h1>RION Luxury Hoodie</h1>
    <div class="price">৳ 1,250</div>
    <button onclick="orderNow()">ORDER NOW</button>
  </div>
</div>

<script>
function orderNow(){
  const phone = "8801770775275";
  const message =
    "🛍️ RION SHOP ORDER%0A%0A" +
    "📦 Product: RION Luxury Hoodie%0A" +
    "💰 Price: ৳ 1,250%0A%0A" +
    "👤 Customer Name:%0A" +
    "📞 Phone Number:%0A" +
    "📍 Delivery Address:%0A" +
    "🔢 Quantity: 1";

  window.open("https://wa.me/" + phone + "?text=" + message, "_blank");
}
</script>

</body>
</html>
